name: Validate

on:
  pull_request:
    paths:
      - "kapitel/**"
      - "publishing/**"
      - "omslag/**"
      - "scripts/**"
      - "project-manifest.json"
      - "README.md"
      - "roman-bibel.md"
      - "synopsis.md"
      - "kapitelplan.md"
      - "projektstatus.md"
      - "project-index.md"
      - "kapitelnoteringar.md"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "kapitel/**"
      - "publishing/**"
      - "omslag/**"
      - "scripts/**"
      - "project-manifest.json"
      - "README.md"
      - "roman-bibel.md"
      - "synopsis.md"
      - "kapitelplan.md"
      - "projektstatus.md"
      - "project-index.md"
      - "kapitelnoteringar.md"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate project
        run: python3 scripts/validate_project.py .
